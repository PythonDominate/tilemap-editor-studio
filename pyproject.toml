[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tilemap-editor-studio"
version = "0.9.3"
description = "Plugin-host 2D tilemap editor for Windows — layers, autotiling, brushes, exporters."
readme = "CONTRIBUTING.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "tilemap-editor-studio contributors" }]
keywords = ["tilemap", "editor", "gamedev", "autotile", "level-design", "plugin-host"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: Multimedia :: Graphics :: Editors",
]

dependencies = [
    "PySide6>=6.7,<6.9",
    "numpy>=1.26",
    "Pillow>=10.3",
    "tomli>=2.0; python_version < '3.11'",
    "watchdog>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-qt>=4.4", "ruff>=0.5", "mypy>=1.10"]
native = ["pybind11>=2.12"]

[project.scripts]
tilemap-studio = "tilemap_editor_studio.bootstrap.launcher:main"

[project.entry-points."tilemap_studio.plugins"]
autotile_wang = "plugins.autotile_wang.plugin:AutotileWangPlugin"
tiled_exporter = "plugins.tiled_exporter.plugin:TiledExporterPlugin"

[tool.setuptools.packages.find]
where = ["."]
include = ["tilemap_editor_studio*", "plugins*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"